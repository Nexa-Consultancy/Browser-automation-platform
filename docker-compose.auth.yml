version: '3.8'

services:
  # Persistent browser data volume - stores MS Teams cookies/tokens
  auth-data-vol:
    volumes:
      - teams-browser-data:/app/data/browsers
      - teams-auth-cache:/app/data/auth/.cache

  # Override in docker-compose.yml with:
  - volumes:
      - ./data/browsers:/app/data/browsers
      - ./data/auth/cache:/app/data/auth/.cache

# Use same volume mount in main docker-compose.yml:
#   - app-data:/app/data/browsers
volume_app_data:
  driver: local

volumes:
  teams-browser-data:
    # Persists across container restarts
    # MS Teams session cookies will be available to all new containers
    external: true # or remove 'external:' for docker-compose to create it

# To enable shared auth across all instances:
# In .env: set BROWSER_DATA_DIR=/app/data/browsers-shared-volume
