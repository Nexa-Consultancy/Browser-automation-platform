server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Plain `proxy_pass http://api:4000` resolves the
  # hostname once at nginx startup and caches that IP for the life of the
  # worker process — so every time the api container gets recreated by a
  # deploy (new IP), nginx keeps sending requests to the dead one until the
  # dashboard container itself happens to restart too. Routing proxy_pass
  # through a variable forces nginx to re-resolve via this resolver instead
  # of caching indefinitely.
  resolver 127.0.0.11 valid=10s;
  set $api_upstream http://api:4000;

  location /api/ {
    proxy_pass $api_upstream/api/;
    proxy_set_header Host $http_host;
  }

  # Long-lived: a "wait for video" step can hold this open for hours.
  location /ws {
    proxy_pass $api_upstream/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Forward the real Host (not the "api:4000" upstream address) — the API's
    # WebSocket Origin check compares against this.
    proxy_set_header Host $http_host;
    proxy_read_timeout 10800s;
    proxy_send_timeout 10800s;
  }

  location / {
    # Never let a browser/CDN cache a stale index.html pointing at old,
    # already-replaced JS bundle filenames after a redeploy.
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
