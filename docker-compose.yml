services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qa_automation}
      POSTGRES_USER: ${POSTGRES_USER:-qa_automation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_automation}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qa_automation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-qa_automation}
      POSTGRES_USER: ${POSTGRES_USER:-qa_automation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_automation}
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
    ports:
      - "4000:4000"
    restart: unless-stopped

  # Runs the Playwright sessions. Scale for more parallel throughput:
  #   docker compose up -d --scale worker=3
  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-qa_automation}
      POSTGRES_USER: ${POSTGRES_USER:-qa_automation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_automation}
      REDIS_URL: redis://redis:6379
      WORKER_JOB_CONCURRENCY: ${WORKER_JOB_CONCURRENCY:-10}
      MAX_VIDEO_WAIT_MS: ${MAX_VIDEO_WAIT_MS:-10800000}
    restart: unless-stopped
    # Chromium needs real /dev/shm; the Docker default (64MB) crashes tabs.
    shm_size: "1gb"

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
