services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qa_automation
      POSTGRES_USER: qa_automation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_automation -d qa_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: qa_automation
      POSTGRES_USER: qa_automation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      TZ: ${TZ}
      # Encrypts each reusable PlatformUser's stored Microsoft/Teams password
      # at rest — only the api process ever decrypts it (see
      # packages/db/src/users.ts); the worker never sees this key.
      CREDENTIALS_ENC_KEY: ${CREDENTIALS_ENC_KEY}
      # Bootstrap logins, created on first boot if they do not exist yet.
      # Kept in .env (gitignored) so no real password reaches the repo.
      # Changing a password here does NOT rewrite an account that already
      # exists — rotate it from inside the app instead.
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      OWNER_NAME: ${OWNER_NAME}
      OWNER_WORKSPACE: ${OWNER_WORKSPACE}
      # Used to build password-reset links in email. Set this to the real
      # public URL or the links point at whatever Host header arrives.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Session cookies are Secure by default. Set to "false" ONLY for a
      # plain-HTTP deployment, where a Secure cookie would be dropped and
      # login would silently do nothing.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "4000:4000"
    restart: unless-stopped
    # Read-write so the "Clear saved logins" action can delete a group's
    # profile directory; the worker is what writes them.
    volumes:
      - profiles:/data/profiles

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: qa_automation
      POSTGRES_USER: qa_automation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      PROFILES_DIR: /data/profiles
    restart: unless-stopped
    # Chromium needs real shared memory for video-heavy tabs (a live call's
    # WebRTC decode/encode) — too little causes exactly the kind of
    # mid-session instability that looks like the site randomly dropping a
    # call. Bumped from 1gb as cheap insurance on a server that also runs
    # several other resource-hungry apps (see docker-compose CPU sharing).
    shm_size: "2gb"
    # Persistent per-user browser profiles (cookies, logins, history) so a
    # Teams sign-in done once carries into every later run for that group.
    volumes:
      - profiles:/data/profiles

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    depends_on:
      - api

volumes:
  pgdata:
  profiles:
